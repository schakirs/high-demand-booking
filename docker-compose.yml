services:
  postgres:
    image: postgres:18.6
    environment:
      # Local-only credentials (D-030 scope: not a real secret). Override in a real
      # environment via POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB.
      POSTGRES_USER: hdb_app
      POSTGRES_PASSWORD: hdb_app
      POSTGRES_DB: hdb
    ports:
      - "5432:5432"
    volumes:
      # 18+ images store PGDATA in a version-specific subdirectory under a single mount
      # at /var/lib/postgresql (not .../data as in earlier major versions): supports
      # "pg_upgrade --link" across major versions without a mount-point boundary.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hdb_app -d hdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.15.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    # The application runs on the host (WSL or Docker Desktop), not in a container.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      # Local-only credentials; override via GF_SECURITY_ADMIN_USER/GF_SECURITY_ADMIN_PASSWORD.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
